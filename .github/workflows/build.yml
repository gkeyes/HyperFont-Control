name: Build module
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
      - name: Build and validate
        env:
          HFC_BUILD_JOBS: '2'
          HFC_CLANG: /usr/bin/clang++
          HFC_LLD: /usr/bin/ld.lld
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: HyperFont-Control
          path: dist/*
          if-no-files-found: error
  release:
    # Every push to main whose module.prop version has no release yet becomes the official (latest) release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: module
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HyperFont-Control
          path: dist
      - name: Publish the release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version already released; nothing to do"
            exit 0
          fi
          python3 tools/release_files.py "v$version"
          gh release create "v$version" dist/HyperFont-Control-*.zip dist/HyperFont-Control-*.zip.sha256 dist/update.json dist/changelog.md \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HyperFont Control $version" --notes-file dist/changelog.md --latest
